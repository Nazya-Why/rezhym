<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Режим</title>
  <meta name="description" content="Жорсткий трекер звичок і режиму дня">
  <meta name="theme-color" content="#eef0f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Режим">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="g-main" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#5ac8fa"/><stop offset=".55" stop-color="#007aff"/><stop offset="1" stop-color="#5856d6"/>
      </linearGradient>
      <linearGradient id="g-success" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#a6f56b"/><stop offset="1" stop-color="#30d158"/>
      </linearGradient>
      <linearGradient id="g-fail" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff9f0a"/><stop offset="1" stop-color="#ff3b30"/>
      </linearGradient>
    </defs>
  </svg>

  <div id="app" class="app">
    <main id="view" class="view"></main>

    <nav class="tabbar glass" aria-label="Розділи">
      <a href="#today" data-route="today">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="m9 16 2 2 4-4"/></svg>
        <span>Сьогодні</span>
      </a>
      <a href="#habits" data-route="habits">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
        <span>Звички</span>
      </a>
      <a href="#focus" data-route="focus">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2h4M12 14l3-3"/><circle cx="12" cy="14" r="8"/></svg>
        <span>Фокус</span>
      </a>
      <a href="#stats" data-route="stats">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>
        <span>Прогрес</span>
      </a>
    </nav>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
